name: Build App

on:
    push:
        branches: ["main"]

jobs:
    build_web:
        runs-on: "ubuntu-latest"
        outputs:
            build_dir: ${{ steps.set_output.outputs.build_dir }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
            
            - name: Install dependencies
              run: npm install

            - name: Build web app
              run: npm run build
            
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: web-build
                  path: dist/

    build_linux:
        needs: build_web
        runs-on: "ubuntu-latest"
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "18"
            
            - name: Install dependencies
              run: npm install
            
            - name: Download web build artifact
              uses: actions/download-artifact@v4
              with:
                    name: web-build
                    path: ./dist
                
            - name: Install System Dependencies
              run: |
                sudo apt update
                sudo apt install -y \
                libwebkit2gtk-4.1-dev \
                libjavascriptcoregtk-4.1-dev \
                libsoup-3.0-dev \
                libglib2.0-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                pkg-config \
                build-essential \
                curl \
                wget \
                libssl-dev
            
            - name: Setup Rust
              uses: actions-rs/toolchain@v1
              with:
                profile: minimal
                toolchain: "stable"
                override: true

            - name:  Build Tauri Linux executable
              run: |
                npm run tauri:build
            
            - name: Upload Linux build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: linux-build
                  path: src-tauri/target/release/bundle
