name: Build App

on:
  push:
    branches: ["main", "dev"]

jobs:
  build_web:
    runs-on: "ubuntu-latest"
    outputs:
      build_dir: ${{ steps.set_output.outputs.build_dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Fix dependency issues
        run: npm audit fix

      - name: Build web app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist/

  build_engine_linux:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch .so from GitHub Release
        env:
          REPO: "Julian52575/Hylozoa-Engine-Engine"
          REF: "project_create"
        run: |
          RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${REF}")

          DOWNLOAD_URL=$(echo "$RELEASE" | \
            python3 -c "
          import sys, json
          assets = json.load(sys.stdin)['assets']
          match = [a['browser_download_url'] for a in assets if 'hylozoa_engine' in a['name'] and a['name'].endswith('.so')]
          print(match[0] if match else '')
          ")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "No .so asset found in release ${REF}"
            exit 1
          fi

          echo "Downloading: $DOWNLOAD_URL"
          mkdir -p engine/lib
          curl -fsSL -o engine/lib/libhylozoa_engine.so "$DOWNLOAD_URL"

      - name: Install CMake & build tools
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake

      - name: Build binary
        run: |
          mkdir -p engine/build
          cmake -S engine -B engine/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_EXE_LINKER_FLAGS="-L${{ github.workspace }}/engine/lib -lhylozoa_engine"
          cmake --build engine/build --config Release

      - name: Upload engine Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: hylozoa-engine-linux
          path: engine/build/hylozoa-x86_64-unknown-linux-gnu

  build_engine_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install CMake & build tools
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes

      - name: Build engine
        run: |
          mkdir engine\build
          cmake -S engine -B engine\build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine\build --config Release

      - name: Upload engine Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: hylozoa-engine-windows
          path: engine/build/hylozoa-x86_64-pc-windows-msvc

  build_linux:
    needs: [build_web, build_engine_linux]
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Download web build artifact
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: ./dist

      - name: Download engine Linux binary
        uses: actions/download-artifact@v7
        with:
          name: hylozoa-engine-linux
          path: ./engine-bin

      - name: Place engine binary for Tauri sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp ./engine-bin/* ./src-tauri/binaries/
          chmod +x src-tauri/binaries/*

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libglib2.0-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          pkg-config \
          build-essential \
          curl \
          wget \
          libssl-dev \
          libfuse2t64

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: "stable"
          override: true

      - name: Build Tauri Linux executable
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          npm run tauri build

      - name: Upload Debian Package
        uses: actions/upload-artifact@v7
        with:
          name: hylozoa-ui-debian
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload RPM Package
        uses: actions/upload-artifact@v7
        with:
          name: hylozoa-ui-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Raw Binary
        uses: actions/upload-artifact@v7
        with:
          name: hylozoa-ui-binary
          path: src-tauri/target/release/hylozoa-ui

  build_windows:
    needs: [build_web, build_engine_windows]
    runs-on: windows-latest
    steps:
      # Etape 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v7

      # Etape 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      # Etape 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Etape 4: Build project
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: ./dist

      - name: Download engine Windows binary
        uses: actions/download-artifact@v7
        with:
          name: hylozoa-engine-windows
          path: ./engine-bin

      - name: Place engine binary for Tauri sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp ./engine-bin/* ./src-tauri/binaries/
          chmod +x src-tauri/binaries/*

      # Etape 5: Setup Tauri prerequisites
      - name: Setup Rust (required for Tauri)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      # Etape 6: build Tauri Windows executable
      - name: Build Tauri Windows executable
        run: |
          npm run tauri build -- --target x86_64-pc-windows-msvc
      # Etape 7: Create Windows installer
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri_windows_installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
